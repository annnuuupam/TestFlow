server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ots_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:ots_user}
    password: ${SPRING_DATASOURCE_PASSWORD:ots_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mvc:
    pathmatch:
      use-suffix-pattern: false

jwt:
  secret: ${JWT_SECRET:c2VjcmV0a2V5Zm9yb25saW5ldGVzdHN5c3RlbTIwMjRqd3Rfc2VjcmV0a2V5X3N0cmluZw==}
  expiration: ${JWT_EXPIRATION:86400000}   # 24 hours in milliseconds

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  code-runner:
    enabled: ${CODE_RUNNER_ENABLED:true}
    strategy: ${CODE_RUNNER_STRATEGY:local}  # Options: local, judge0
  judge0:
    api-url: ${JUDGE0_API_URL:https://judge0-ce.p.rapidapi.com}
    api-key: ${JUDGE0_API_KEY:your_api_key_here}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@example.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    com.ots: DEBUG
    org.springframework.security: INFO
