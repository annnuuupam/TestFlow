version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ots-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ots_db
      MYSQL_USER: ots_user
      MYSQL_PASSWORD: ots_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build: ./backend
    container_name: ots-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ots_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ots_user
      SPRING_DATASOURCE_PASSWORD: ots_password
      JWT_SECRET: c2VjcmV0a2V5Zm9yb25saW5ldGVzdHN5c3RlbTIwMjRqd3Rfc2VjcmV0a2V5X3N0cmluZw==
      JWT_EXPIRATION: 86400000
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ots-frontend
    ports:
      - "80:80"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysql_data:
